<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="qBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#150409" />
      <stop offset="50%" stop-color="#090204" />
      <stop offset="100%" stop-color="#120307" />
    </linearGradient>
    <radialGradient id="qAura" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="barGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#9f1239" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#qBg)" />
  <circle cx="400" cy="350" r="380" fill="url(#qAura)" />

  <!-- App Header -->
  <rect x="40" y="40" width="720" height="60" rx="16" fill="#1b060d" stroke="#3d111d" stroke-width="2" />
  <circle cx="80" cy="70" r="8" fill="#e11d48" />
  <text x="105" y="76" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="900" letter-spacing="2">CALMQURAN</text>
  <text x="270" y="75" fill="#fda4af" font-family="monospace" font-size="12">SERENE RECITER</text>
  <rect x="580" y="55" width="150" height="30" rx="15" fill="#e11d48" />
  <text x="655" y="75" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">TILAWAN HD</text>

  <!-- Surah Hero Card -->
  <rect x="40" y="130" width="720" height="420" rx="24" fill="#080204" stroke="#481422" stroke-width="2" />
  
  <text x="400" y="190" fill="#fda4af" font-family="monospace" font-size="14" letter-spacing="3" text-anchor="middle">SURAH AL-FATIHAH (001)</text>
  <text x="400" y="220" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" text-anchor="middle">Pembukaan • 7 Ayat • Makkiyah</text>
  
  <!-- Arabic Ayah Typography -->
  <text x="400" y="320" fill="#ffffff" font-family="serif, 'Amiri', 'Traditional Arabic'" font-size="44" font-weight="bold" text-anchor="middle">
    بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ
  </text>
  
  <text x="400" y="380" fill="#fca5a5" font-family="monospace" font-size="15" font-style="italic" text-anchor="middle">
    "Bismillāhir-raḥmānir-raḥīm"
  </text>

  <text x="400" y="420" fill="#e2c8cf" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">
    Dengan nama Allah Yang Maha Pengasih, Maha Penyayang.
  </text>

  <!-- Sound Equalizer Bars Waveform -->
  <g transform="translate(180, 480)">
    <rect x="0" y="-30" width="8" height="45" rx="4" fill="url(#barGlow)" />
    <rect x="18" y="-15" width="8" height="30" rx="4" fill="url(#barGlow)" />
    <rect x="36" y="-45" width="8" height="60" rx="4" fill="url(#barGlow)" />
    <rect x="54" y="-20" width="8" height="35" rx="4" fill="url(#barGlow)" />
    <rect x="72" y="-55" width="8" height="70" rx="4" fill="url(#barGlow)" />
    <rect x="90" y="-35" width="8" height="50" rx="4" fill="url(#barGlow)" />
    <rect x="108" y="-60" width="8" height="75" rx="4" fill="url(#barGlow)" />
    <rect x="126" y="-25" width="8" height="40" rx="4" fill="url(#barGlow)" />
    <rect x="144" y="-70" width="8" height="85" rx="4" fill="url(#barGlow)" />
    <rect x="162" y="-40" width="8" height="55" rx="4" fill="url(#barGlow)" />
    <rect x="180" y="-80" width="8" height="95" rx="4" fill="url(#barGlow)" />
    <rect x="198" y="-50" width="8" height="65" rx="4" fill="url(#barGlow)" />
    <rect x="216" y="-65" width="8" height="80" rx="4" fill="url(#barGlow)" />
    <rect x="234" y="-30" width="8" height="45" rx="4" fill="url(#barGlow)" />
    <rect x="252" y="-75" width="8" height="90" rx="4" fill="url(#barGlow)" />
    <rect x="270" y="-45" width="8" height="60" rx="4" fill="url(#barGlow)" />
    <rect x="288" y="-60" width="8" height="75" rx="4" fill="url(#barGlow)" />
    <rect x="306" y="-25" width="8" height="40" rx="4" fill="url(#barGlow)" />
    <rect x="324" y="-50" width="8" height="65" rx="4" fill="url(#barGlow)" />
    <rect x="342" y="-20" width="8" height="35" rx="4" fill="url(#barGlow)" />
    <rect x="360" y="-40" width="8" height="55" rx="4" fill="url(#barGlow)" />
    <rect x="378" y="-15" width="8" height="30" rx="4" fill="url(#barGlow)" />
    <rect x="396" y="-30" width="8" height="45" rx="4" fill="url(#barGlow)" />
    <rect x="414" y="-10" width="8" height="25" rx="4" fill="url(#barGlow)" />
  </g>

  <!-- Player Controls Bar -->
  <rect x="40" y="580" width="720" height="90" rx="18" fill="#18050c" stroke="#3d121d" stroke-width="1.5" />
  <circle cx="400" cy="625" r="32" fill="#e11d48" />
  <polygon points="394,611 394,639 416,625" fill="#ffffff" />
  
  <text x="80" y="620" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Mishary Rashid Alafasy</text>
  <text x="80" y="642" fill="#9f8a91" font-family="monospace" font-size="12">Murottal HQ • Ambience Rain (40%)</text>

  <text x="700" y="632" fill="#fda4af" font-family="monospace" font-size="14" text-anchor="end">01:45 / 03:20</text>

  <!-- Ambience & Features Row -->
  <text x="40" y="720" fill="#fca5a5" font-family="monospace" font-size="14" font-weight="bold" letter-spacing="1">AMBIENCE SOUNDSCAPES</text>

  <rect x="40" y="740" width="220" height="80" rx="14" fill="#1b060d" stroke="#e11d48" stroke-width="1.5" />
  <text x="60" y="775" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">🌧️ Soft Rain</text>
  <text x="60" y="798" fill="#fda4af" font-family="monospace" font-size="11">Active Ambience</text>

  <rect x="290" y="740" width="220" height="80" rx="14" fill="#120408" stroke="#38101c" stroke-width="1.5" />
  <text x="310" y="775" fill="#eed1d8" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">🌙 Night Wind</text>
  <text x="310" y="798" fill="#9f8a91" font-family="monospace" font-size="11">Ambient Mode</text>

  <rect x="540" y="740" width="220" height="80" rx="14" fill="#120408" stroke="#38101c" stroke-width="1.5" />
  <text x="560" y="775" fill="#eed1d8" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">🌊 Calm Stream</text>
  <text x="560" y="798" fill="#9f8a91" font-family="monospace" font-size="11">Ambient Mode</text>

  <!-- Surah Quick List -->
  <text x="40" y="865" fill="#fca5a5" font-family="monospace" font-size="14" font-weight="bold" letter-spacing="1">SURAH SELECTION</text>

  <rect x="40" y="885" width="345" height="70" rx="14" fill="#16050b" stroke="#330e18" stroke-width="1" />
  <text x="60" y="915" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">055. Ar-Rahman</text>
  <text x="60" y="937" fill="#fda4af" font-family="monospace" font-size="11">78 Ayat • Nikmat Allah</text>

  <rect x="415" y="885" width="345" height="70" rx="14" fill="#16050b" stroke="#330e18" stroke-width="1" />
  <text x="435" y="915" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">067. Al-Mulk</text>
  <text x="435" y="937" fill="#fda4af" font-family="monospace" font-size="11">30 Ayat • Kerajaan</text>
</svg>
